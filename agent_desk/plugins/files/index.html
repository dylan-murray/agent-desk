<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Files</title>
<link rel="stylesheet" href="../sdk/plugin.css"><link rel="stylesheet" href="files.css"></head>
<body><header><nav class="path" aria-label="Folder shown"><button type="button" id="up" title="Up a folder" aria-label="Up a folder"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5v-9M4.5 7 8 3.5 11.5 7"/></svg></button><div id="crumbs"></div></nav>
<div id="away" hidden></div>
<div class="filter"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg><input id="filter" type="search" placeholder="Filter files" aria-label="Filter files" autocomplete="off" spellcheck="false"><button type="button" id="changed" aria-pressed="false" title="Show only files that changed since the last commit">Changed</button><button type="button" id="collapse" title="Collapse every folder" aria-label="Collapse every folder"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6.5 3-3 3 3M5 9.5l3 3 3-3"/></svg></button></div></header>
<div id="tree" role="tree" aria-label="Files in the folder shown"></div><p id="note" hidden></p>
<div id="menu" role="menu" aria-label="File actions" hidden></div>
<script src="../sdk/agent-desk.js"></script><script src="files.js"></script></body></html>
