name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pipx run ruff==0.17.0 check agent_desk tests scripts
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test shell
        if: runner.os == 'Linux'
        # Interactive zsh stops at compinit's insecure-directory prompt on the hosted runner.
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_*.cjs
      - run: agent-desk --help
