name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pipx run ruff==0.17.0 check agent_desk tests scripts
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test shell
        if: runner.os == 'Linux'
        # Interactive zsh stops at compinit's insecure-directory prompt on the hosted runner.
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_*.cjs
      - run: agent-desk --help
