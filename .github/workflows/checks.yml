name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pipx run ruff==0.17.0 check agent_desk tests scripts
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test shell
        if: runner.os == 'Linux'
        # Interactive zsh stops at compinit's insecure-directory prompt on the hosted runner.
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_*.cjs
      - run: agent-desk --help
